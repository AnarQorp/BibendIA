name: RK coverage 03 validation

on:
  push:
    branches:
      - feat/rk-coverage-expansion-03

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck:server
          npm run test:server

      - name: Bootstrap migration gates
        run: npm run test:bootstrap

      - name: RK integration tests on clean PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          container="bibendia-rk03-ci-$GITHUB_RUN_ID"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run -d --name "$container" -p 127.0.0.1::5432             -e POSTGRES_PASSWORD=rk03-ci-postgres             -e POSTGRES_DB=bibendia postgres:17-alpine >/dev/null

          for attempt in $(seq 1 30); do
            if docker exec "$container" psql -U postgres -d bibendia -Atc 'SELECT 1' >/dev/null 2>&1; then break; fi
            [ "$attempt" -lt 30 ] || { echo 'PostgreSQL not ready' >&2; exit 1; }
            sleep 1
          done

          docker cp server/bootstrap/001_database_capabilities.sql "$container":/tmp/bootstrap.sql
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d bibendia -f /tmp/bootstrap.sql >/dev/null
          docker exec "$container" psql -v ON_ERROR_STOP=1 -U postgres -d bibendia -c "
            CREATE ROLE bibendia_migrator_login LOGIN PASSWORD 'migrator-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            CREATE ROLE bibendia_api_login LOGIN PASSWORD 'api-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            CREATE ROLE bibendia_worker_login LOGIN PASSWORD 'worker-ci' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
            GRANT bibendia_migrator TO bibendia_migrator_login;
            GRANT bibendia_api TO bibendia_api_login;
            GRANT bibendia_worker TO bibendia_worker_login;
          " >/dev/null

          port="$(docker port "$container" 5432/tcp | sed 's/.*://')"
          export NODE_ENV=production
          export MIGRATOR_DATABASE_URL="postgresql://bibendia_migrator_login:migrator-ci@127.0.0.1:$port/bibendia"
          export API_DATABASE_URL="postgresql://bibendia_api_login:api-ci@127.0.0.1:$port/bibendia"
          export WORKER_DATABASE_URL="postgresql://bibendia_worker_login:worker-ci@127.0.0.1:$port/bibendia"

          npm run build:server
          mkdir -p server/dist/migrations
          cp server/migrations/*.sql server/dist/migrations/
          node server/dist/src/persistence/migrate.js

          npx vitest run --config server/vitest.integration.config.ts             server/test/integration/repair-knowledge-foundation.test.ts             server/test/integration/repair-knowledge-vehicle-discovery.test.ts             server/test/integration/repair-knowledge-coverage-01.test.ts             server/test/integration/repair-knowledge-coverage-02.test.ts             server/test/integration/repair-knowledge-coverage-03.test.ts
