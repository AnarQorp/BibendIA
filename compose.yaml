services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bibendia
      POSTGRES_USER: bibendia
      POSTGRES_PASSWORD: bibendia
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bibendia -d bibendia"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - bibendia_pgdata:/var/lib/postgresql/data

volumes:
  bibendia_pgdata:
